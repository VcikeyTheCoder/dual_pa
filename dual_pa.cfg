# dual_pa example. Copy the section into printer.cfg (or include this file).
# Docs: docs/Dual_PA.md

[dual_pa]
# extruder: extruder is the default; use [dual_pa extruder1] for another
push_pressure_advance: 0.0578
#   Advance while the extruder speeds up (rise edge of a PA test).
#   Default: the extruder's pressure_advance.
pull_pressure_advance: 0.0493
#   Advance while the extruder slows down (fall edge of a PA test).
#   Default: the extruder's pressure_advance.
#settle_time: 0.2
#   Time (seconds) the advance takes to move from the push amount to the
#   pull amount while printing at a steady speed. 0 moves it at once.
#smooth_time:
#   Default: the extruder's pressure_advance_smooth_time.
